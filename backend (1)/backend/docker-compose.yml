services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER in backend .env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend .env}"
      POSTGRES_DB: "${POSTGRES_DB:?Set POSTGRES_DB in backend .env}"
    ports:
      - "5432:5432"
    volumes:
      - jaldrishti_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL in backend .env}"
      CORS_ORIGINS: http://localhost:3000
      ENVIRONMENT: local
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  jaldrishti_db_data:
